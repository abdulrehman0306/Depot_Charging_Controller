# Starts the whole system with one command:
#     docker compose up -d
#
#   mqtt        MQTT broker (Mosquitto); the meter publishes its readings here
#   meter       simulated building energy meter (Modbus TCP, and publishes over MQTT)
#   controller  the CSMS: OCPP server, control loop, REST API on http://localhost:8000
#   chargers    ten simulated chargers; this container stops when the last van has left
#   influxdb    database for all measurements, http://localhost:8086
#   grafana     dashboard, http://localhost:3000
#
# Secrets come from the .env file (see .env.example); none are written here.
# Speed, scenario and strategy can be set in .env too (see .env.example); otherwise
# the defaults below are used. All programs must use the same simulation speed.

# Settings shared by the three Python programs (they use the same image, built from the Dockerfile).
x-python-program: &python-program
  build: .
  image: depot-charging-controller:latest
  # Start a tiny init process as the container's first process (PID 1). It passes stop
  # signals on to Python and cleans up finished child processes, which Python as PID 1
  # does not do, so `docker compose stop` always works.
  init: true
  environment: &simulation-settings
    SIM_SPEED: ${SIM_SPEED:-60}
    SCENARIO: ${SCENARIO:-normal_evening}
    STRATEGY: ${STRATEGY:-smart}
    # Where the controller reads the building load: modbus (default) or mqtt.
    BUILDING_LOAD_SOURCE: ${BUILDING_LOAD_SOURCE:-modbus}
    MQTT_HOST: mqtt

services:
  mqtt:
    image: eclipse-mosquitto:2.0.23
    ports:
      # Only reachable from this computer, e.g. to watch the readings with mosquitto_sub.
      - "127.0.0.1:1883:1883"
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    healthcheck:
      # "Healthy" as soon as a subscriber gets the broker's own uptime message.
      test: ["CMD", "mosquitto_sub", "-h", "localhost", "-t", "$$SYS/broker/uptime", "-C", "1", "-W", "3"]
      interval: 2s
      retries: 30

  meter:
    <<: *python-program
    command: ["python", "-m", "src.meter.modbus_meter"]
    environment:
      <<: *simulation-settings
      # Listen on all addresses inside the container, so the controller can reach it.
      METER_HOST: 0.0.0.0
    depends_on:
      mqtt:
        condition: service_healthy
    healthcheck:
      # "Healthy" as soon as the Modbus port accepts a connection.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 5020), timeout=2)"]
      interval: 2s
      retries: 30

  controller:
    <<: *python-program
    command: ["python", "-m", "src.controller.run_controller"]
    ports:
      - "8000:8000"
    environment:
      <<: *simulation-settings
      CSMS_HOST: 0.0.0.0
      API_HOST: 0.0.0.0
      # Inside Docker the other programs are reached by their service names.
      METER_HOST: meter
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    depends_on:
      meter:
        condition: service_healthy
      mqtt:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    healthcheck:
      # "Healthy" as soon as the OCPP port accepts a connection.
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 9000), timeout=2)"]
      interval: 2s
      retries: 60

  chargers:
    <<: *python-program
    command: ["python", "-m", "src.chargers.run_chargers"]
    environment:
      <<: *simulation-settings
      CSMS_HOST: controller
    depends_on:
      controller:
        condition: service_healthy
    # One night, then the chargers program ends. Do not start it again by itself.
    restart: "no"

  influxdb:
    image: influxdb:2.7.11
    ports:
      - "8086:8086"
    environment:
      # On the very first start, InfluxDB sets itself up with this user, organisation,
      # bucket and token. Later starts reuse what is stored in the influxdb-data volume.
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_ADMIN_USER}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_ADMIN_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 2s
      retries: 30

  grafana:
    image: grafana/grafana:11.5.2
    ports:
      - "3000:3000"
    depends_on:
      - influxdb
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      # Open the depot dashboard as the home page.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/depot_charging.json
      # The image renderer (only started with --profile screenshot) turns a dashboard into a PNG.
      GF_RENDERING_SERVER_URL: http://renderer:8081/render
      GF_RENDERING_CALLBACK_URL: http://grafana:3000/
      # Used by grafana/provisioning/datasources/influxdb.yml.
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      # The provisioning files and the dashboard JSON come straight from this repository.
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana

  # Only for saving a dashboard screenshot (python -m src.dashboard_screenshot):
  #     docker compose --profile screenshot up -d
  renderer:
    image: grafana/grafana-image-renderer:3.11.0
    profiles: ["screenshot"]

volumes:
  influxdb-data:
  grafana-data:

# Mosquitto, the MQTT broker. Used by docker-compose.yml and by the tests in
# GitHub Actions.

# Listen for MQTT on the standard port 1883, on every address inside the container.
listener 1883

# No user names or passwords: only programs on this computer's Docker network can
# reach it (docker-compose.yml publishes the port on 127.0.0.1 only). A real depot
# would use passwords and TLS, see the README.
allow_anonymous true

# Keep nothing on disk: the readings are live values, an old one is of no use.
persistence false

# Log to the container's output (docker compose logs mqtt).
log_dest stdout
